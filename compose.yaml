services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST to the VM public IPv4 address}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
    volumes:
      - debates:/var/lib/debate-signal

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to the VM public IPv4 address}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data

volumes:
  debates:
  certificates:
